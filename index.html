<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HTML">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171a19" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>HTML ビューアー</title>
<style>
  /* 色と書体の定義 */
  :root {
    --paper: #fafaf9; --surface: #ffffff; --surface-soft: #f5f6f4; --ink: #26372f; --sub: #5f6e66; --faint: #647069;
    --rule: #e7e8e4; --rule-strong: #d6d8d3; --accent: #3c4d94; --tint: #eceffa; --hover: #f0f1ee; --risk: #9a4a3f;
    --shadow: 0 1px 2px rgb(20 32 24 / .05), 0 12px 32px -20px rgb(20 32 24 / .28);
    --radius: 14px; --radius-s: 10px;
    --font-body: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    --font-display: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    --ease: cubic-bezier(.2,.7,.2,1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #171a19; --surface: #202423; --surface-soft: #282d2b; --ink: #e6ece8; --sub: #a0aaa4; --faint: #959f99;
      --rule: #303a35; --rule-strong: #3a4540; --accent: #b1bfff; --tint: #2c3654; --hover: #303934; --risk: #efb0a1;
      --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 12px 32px -20px rgb(0 0 0 / .7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
      --paper: #171a19; --surface: #202423; --surface-soft: #282d2b; --ink: #e6ece8; --sub: #a0aaa4; --faint: #959f99;
      --rule: #303a35; --rule-strong: #3a4540; --accent: #b1bfff; --tint: #2c3654; --hover: #303934; --risk: #efb0a1;
      --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 12px 32px -20px rgb(0 0 0 / .7);
      color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; background: var(--paper); color: var(--ink);
    font: 1.0625rem/1.95 var(--font-body); letter-spacing: .015em; -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, label:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* 上部バー：半透明の地にぼかし */
  .topbar {
    position: sticky; top: 0; z-index: 10; flex: none;
    display: flex; align-items: center; gap: .5rem;
    padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
    min-height: calc(52px + env(safe-area-inset-top));
    background: color-mix(in srgb, var(--paper) 86%, transparent);
    -webkit-backdrop-filter: saturate(1.4) blur(12px); backdrop-filter: saturate(1.4) blur(12px);
    border-bottom: 1px solid var(--rule);
  }
  .brand { flex: 1; min-width: 0; margin: 0; font-size: .86rem; font-weight: 650; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn {
    flex: none; width: 40px; height: 40px; padding: 0; display: inline-grid; place-items: center; cursor: pointer;
    border: 1px solid var(--rule-strong); border-radius: 50%; background: var(--surface-soft); color: var(--ink);
  }
  .icon-btn.primary { border-color: var(--accent); background: var(--accent); color: var(--surface); }
  .icon-btn.ghost { border-color: transparent; background: none; color: var(--faint); }
  .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentcolor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }

  /* 一覧の画面 */
  #home { flex: 1; overflow: auto; padding: 1rem max(18px, env(safe-area-inset-right)) calc(2.5rem + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); }
  .inner { max-width: 44rem; margin: 0 auto; }
  #list { margin: 0; padding: 0; list-style: none; display: grid; gap: .7rem; }
  #list li { display: flex; align-items: stretch; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  #list .open { flex: 1; min-width: 0; padding: .95rem 1.15rem; border: 0; background: none; text-align: left; transition: background-color .15s; }
  #list .open:active, #list .open:hover { background: var(--hover); }
  #list .kind { flex: none; width: 22px; height: 22px; margin-top: .15rem; color: var(--sub); fill: none; stroke: currentcolor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #list .kind.answer { color: var(--accent); }
  #list .open { display: flex; gap: .75rem; align-items: flex-start; }
  #list .text { min-width: 0; }
  #list .name { display: block; font-size: 1rem; font-weight: 600; line-height: 1.55; word-break: break-all; }
  #list .info { display: block; margin-top: .2rem; font-size: .8rem; line-height: 1.6; color: var(--faint); font-variant-numeric: tabular-nums; }
  #list .del { flex: none; width: 52px; display: grid; place-items: center; padding: 0; border: 0; border-left: 1px solid var(--rule); background: none; color: var(--faint); transition: color .15s; }
  #list .del svg, #list .badge svg { width: 18px; height: 18px; fill: none; stroke: currentcolor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #list .del:hover, #list .del:focus-visible { color: var(--risk); }

  .empty { display: grid; place-items: center; height: 46vh; border: 1.5px dashed var(--rule-strong); border-radius: var(--radius); color: var(--faint); cursor: pointer; }
  .empty svg { width: 56px; height: 56px; fill: none; stroke: currentcolor; stroke-width: 1.6; stroke-linecap: round; }

  /* 表示の画面 */
  #frame { flex: 1; width: 100%; border: 0; background: #fff; }

  /* ページから届いた返事を保存する帯 */
  #answerBar { flex: none; display: flex; align-items: center; gap: .6rem; padding: .55rem max(16px, env(safe-area-inset-right)) .55rem max(16px, env(safe-area-inset-left));
    background: var(--tint); border-bottom: 1px solid var(--rule-strong); font-size: .9rem; line-height: 1.5; color: var(--accent); }
  .bar-icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentcolor; stroke-width: 2; stroke-linejoin: round; }
  #answerMsg { flex: 1; min-width: 0; }
  #list .badge { margin-left: .45rem; color: var(--accent); vertical-align: -3px; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header class="topbar">
    <button id="back" class="icon-btn" hidden aria-label="一覧へ戻る"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <p id="title" class="brand"></p>
    <button id="themeBtn" class="icon-btn ghost" type="button" aria-label="表示: OS に合わせる"></button>
    <label class="icon-btn primary" id="openBtn" aria-label="開く"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><input id="file" type="file" accept=".html,.htm,text/html"></label>
  </header>

  <div id="answerBar" role="status" hidden>
    <svg class="bar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>
    <span id="answerMsg"></span>
    <button id="answerSave" class="icon-btn primary" type="button" aria-label="返事を保存"><svg viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 14v5h14v-5"/></svg></button>
    <button id="answerClose" class="icon-btn ghost" type="button" aria-label="帯を閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <main id="home">
    <div class="inner">
      <ul id="list"></ul>
      <label id="empty" class="empty" hidden aria-label="開く"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><input id="file2" type="file" accept=".html,.htm,text/html"></label>
    </div>
  </main>

<script src="app.js"></script>
</body>
</html>
